volumes:
  pg_data:
  pg_data_v16:
  static:
  media:

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pg_data_v16:/var/lib/postgresql/data
  backend:
    image: badmajor/elmobil_backend
    env_file: .env
    volumes:
      - static:/static/
      - media:/elmobil/media/
      - ./elmobil_data.json:/elmobil/temp_data/elmobil_data.json
    depends_on:
      - db
  nginx:
    image: nginx:1.19.3
    ports:
      - "8777:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/static/
      - media:/media/
      - ./img/:/media/img/
    depends_on:
      - backend
