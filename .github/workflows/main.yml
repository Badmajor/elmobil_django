
name: Elmobil.ru Workflow

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build_and_push_to_docker_hub:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./elmobil/
          push: true
          tags: badmajor/elmobil_backend:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - build_and_push_to_docker_hub

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug SSH host fingerprints
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.PORT }}
        run: |
          echo "Checking SSH host keys for ${SSH_HOST}:${SSH_PORT}"
          ssh-keyscan -p "$SSH_PORT" -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null \
            | ssh-keygen -lf - -E sha256

      - name: Copy deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "infra/docker-compose.production.yml,infra/nginx.conf"
          target: "/home/deploy/elmobil"
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -eu

            cd /home/deploy/elmobil/infra/

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            docker compose -f docker-compose.production.yml exec -T backend cp -r /elmobil/static/. /static/
